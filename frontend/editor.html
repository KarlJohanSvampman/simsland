<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Holosims World Editor</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #1b1f24;
  color: white;
  font-family: Arial, sans-serif;
}

/* =========================
   CANVAS
========================= */

#c {
  display: block;
  width: 100vw;
  height: 100vh;
}

/* =========================
   TOP BAR
========================= */

#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  background: rgba(20,20,20,0.95);
  display: flex;
  align-items: center;
  padding: 0 10px;
  z-index: 1000;
  border-bottom: 1px solid #444;
}

#topbar button {
  margin-right: 8px;
  padding: 6px 12px;
  background: #3d4754;
  border: none;
  color: white;
  cursor: pointer;
}

#topbar button:hover {
  background: #556170;
}

/* =========================
   SELECTION INFO
========================= */

#editorSelection {
  position: fixed;
  top: 60px;
  left: 10px;
  width: 220px;
  background: rgba(0,0,0,0.85);
  padding: 10px;
  border: 1px solid #444;
  z-index: 999;
}

/* =========================
   INSPECTOR
========================= */

#editorInspector {
  position: fixed;
  top: 60px;
  right: 10px;
  width: 340px;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  background: rgba(0,0,0,0.92);
  padding: 12px;
  border: 1px solid #444;
  z-index: 999;
}

#editorInspector h3 {
  margin-top: 0;
}

/* =========================
   TOOL PANEL
========================= */

#toolPanel {
  position: fixed;
  bottom: 40px;
  left: 10px;
  background: rgba(0,0,0,0.85);
  padding: 10px;
  border: 1px solid #444;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#toolPanel b {
  margin-bottom: 4px;
  display: block;
}

.toolButton {
  display: block;
  padding: 8px 14px;
  background: #333;
  cursor: pointer;
  border: 1px solid #555;
  color: white;
  text-align: center;
  white-space: nowrap;
  user-select: none;
}

.toolButton:hover {
  background: #444;
}

.toolButton.active {
  background: #1a5f2a;
  border-color: #4caf50;
}

/* =========================
   STATUS
========================= */

#statusBar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  background: rgba(15,15,15,0.95);
  border-top: 1px solid #444;
  display: flex;
  align-items: center;
  padding-left: 10px;
  font-size: 12px;
  z-index: 1000;
}

/* =========================
   MODALS
========================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.open {
  display: flex;
}

.modal-box {
  background: #1e2229;
  border: 1px solid #555;
  border-radius: 4px;
  width: 400px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 12px 16px;
  background: #2a2f38;
  border-bottom: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {
  margin: 0;
  font-size: 15px;
}

.modal-close {
  background: none;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 0 4px;
}

.modal-close:hover {
  color: white;
}

.modal-list {
  overflow-y: auto;
  flex: 1;
  padding: 8px;
}

.modal-item {
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid #333;
  font-size: 13px;
}

.modal-item:hover {
  background: #2e3540;
}

.modal-item-id {
  color: #8ab4f8;
  font-size: 11px;
  margin-top: 2px;
}

.modal-empty {
  color: #777;
  font-size: 13px;
  padding: 20px;
  text-align: center;
}

</style>
</head>

<body>

<!-- =========================
     TOPBAR
========================= -->

<div id="topbar">
  <button onclick="saveWorld()">Save World</button>
  <button onclick="reloadWorld()">Reload</button>
  <button onclick="window.location='/meshbank.html'">Mesh Bank</button>
  <button onclick="window.location='/definitions.html'">Definitions</button>
  <button onclick="window.location='/floorplan.html'">Floorplan Designer</button>
  <button onclick="window.location='/social_debug.html'">💬 Social Debug</button>
</div>

<!-- =========================
     TOOL PANEL
========================= -->

<div id="toolPanel">
  <b>Tools</b>
  <div class="toolButton" data-tool="paint_tile" id="btn-paint_tile">🖌 Paint Tile</div>
  <div class="toolButton" data-tool="place_floorplan" id="btn-place_floorplan">🏠 Place Floorplan</div>
  <div class="toolButton" data-tool="place_prop" id="btn-place_prop">📦 Place Prop</div>
  <div class="toolButton" id="btn-spawn_character">👤 Spawn Character</div>
</div>

<!-- =========================
     SELECTION
========================= -->

<div id="editorSelection">
  <b>Selection</b>
  <hr>
  Nothing selected
</div>

<!-- =========================
     INSPECTOR
========================= -->

<div id="editorInspector">
  <h3>Inspector</h3>
  <div id="inspectorContent">Nothing selected</div>
</div>

<!-- =========================
     STATUS BAR
========================= -->

<div id="statusBar">World Editor Ready</div>

<!-- =========================
     MAIN CANVAS
========================= -->

<canvas id="c"></canvas>

<!-- =========================
     MODAL: Paint Tile
========================= -->

<div class="modal-overlay" id="modal-paint_tile">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Select Tile Type</h3>
      <button class="modal-close" onclick="closeModal('modal-paint_tile')">✕</button>
    </div>
    <div class="modal-list" id="list-paint_tile"></div>
  </div>
</div>

<!-- =========================
     MODAL: Place Floorplan
========================= -->

<div class="modal-overlay" id="modal-place_floorplan">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Select Floorplan</h3>
      <button class="modal-close" onclick="closeModal('modal-place_floorplan')">✕</button>
    </div>
    <div class="modal-list" id="list-place_floorplan"></div>
  </div>
</div>

<!-- =========================
     MODAL: Place Prop
========================= -->

<div class="modal-overlay" id="modal-place_prop">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Select Prop</h3>
      <button class="modal-close" onclick="closeModal('modal-place_prop')">✕</button>
    </div>
    <div class="modal-list" id="list-place_prop"></div>
  </div>
</div>

<!-- =========================
     MODAL: Spawn Character
========================= -->

<div class="modal-overlay" id="modal-spawn_character">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Spawn Character</h3>
      <button class="modal-close" onclick="closeModal('modal-spawn_character')">✕</button>
    </div>
    <div class="modal-list" id="list-spawn_character"></div>
  </div>
</div>

<!-- =========================
     WORLD EDITOR APP
========================= -->

<script type="module" src="/src/editor-main.js"></script>

</body>
</html>
