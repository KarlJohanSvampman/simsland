<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Panels</title>
<style>
  :root { --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --bad:#f85149; --good:#3fb950; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; } header h1 span { color: var(--accent); }
  nav.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  nav.tabs button { background: none; border: none; color: var(--dim); padding: 9px 14px; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; }
  nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { flex: 1; min-height: 0; display: flex; }
  .pane { display: none; flex: 1; min-height: 0; } .pane.on { display: flex; }
  .list { width: 250px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .list .items { overflow-y: auto; flex: 1; }
  .item { padding: 7px 12px; cursor: pointer; border-left: 2px solid transparent; display: flex; justify-content: space-between; gap: 8px; }
  .item:hover { background: var(--bg2); } .item.on { background: var(--bg3); border-left-color: var(--accent); }
  .item small { color: var(--dim); font-family: monospace; }
  .types { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 10px; border-top: 1px solid var(--border); }
  .form { width: 470px; overflow-y: auto; padding: 14px 18px; border-right: 1px solid var(--border); }
  .form h3 { margin: 16px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .field { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field > label { color: var(--dim); }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%; }
  input[type=checkbox], input[type=radio] { width: auto; }
  input:focus, select:focus, textarea:focus, button:focus-visible, [contenteditable]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.btn { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button.btn:hover { border-color: var(--accent); } button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; } button.danger { color: var(--bad); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--dim); font-size: 12px; }
  .preview { flex: 1; overflow: auto; padding: 14px; background-color: var(--bg); background-image: radial-gradient(var(--bg3) 1px, transparent 1px); background-size: 20px 20px; }
  .preview canvas { width: 520px; max-width: 100%; display: block; cursor: pointer; }
  .browser { max-height: 240px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px; font-family: monospace; font-size: 12px; margin-top: 6px; }
  .browser div { cursor: pointer; padding: 1px 4px; border-radius: 4px; white-space: nowrap; } .browser div:hover { background: var(--bg3); }
  .browser small { color: var(--dim); }
  .toolbar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; } .toolbar button, .toolbar select, .toolbar input { width: auto; padding: 3px 7px; }
  .rte { min-height: 160px; border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: #0e1118; }
  .rte h1 { font-size: 1.8em; margin: .2em 0; } .rte h2 { font-size: 1.45em; margin: .2em 0; } .rte h3 { font-size: 1.2em; margin: .2em 0; }
  .layouts { flex: 1; overflow-y: auto; padding: 16px 22px; max-width: 900px; }
  .layouts table { border-collapse: collapse; width: 100%; } .layouts td, .layouts th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .layouts th { color: var(--dim); font-size: 11px; text-transform: uppercase; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--bg3); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; display: none; max-width: 480px; }
</style>
</head>
<body>
<header>
  <h1>Debug <span>panels</span></h1>
  <span class="hint">Preview / manage for</span>
  <select id="kindSel" style="width:auto"><option>character</option><option>prop</option><option>household</option><option>building</option></select>
  <select id="entitySel" style="width:auto;min-width:200px"></select>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="design" class="on">Panel templates</button>
  <button data-tab="manage">Manage panels &amp; layouts</button>
</nav>
<main>
  <section class="pane on" data-pane="design">
    <div class="list">
      <div class="items" id="tplList"></div>
      <div class="hint" style="padding:8px 10px 0">New panel:</div>
      <div class="types" id="newTypes"></div>
    </div>
    <div class="form" id="form"><p class="hint">Pick a panel template, or make a new one by choosing a type.</p></div>
    <div class="preview"><div class="hint" id="previewHint" style="margin-bottom:8px">Click points and buttons; scroll on the timeline to zoom, drag it to pan.</div><canvas id="preview" width="900" height="200"></canvas></div>
  </section>
  <section class="pane" data-pane="manage">
    <div class="layouts" id="manage"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script type="module" src="/src/panels/designer.js"></script>
</body>
</html>
