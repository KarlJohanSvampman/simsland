<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behaviour Definitions</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d; --text: #c9d1d9; --dim: #8b949e;
    --accent: #58a6ff; --good: #3fb950; --warn: #d29922; --bad: #f85149; --purple: #bc8cff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .badge { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--bg3); color: var(--dim); }
  .badge.err { background: rgba(248,81,73,.15); color: var(--bad); }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--good); }
  nav.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav.tabs button { background: none; border: none; color: var(--dim); padding: 9px 14px; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { flex: 1; min-height: 0; display: flex; }
  .pane { display: none; flex: 1; min-height: 0; }
  .pane.on { display: flex; }
  .list { width: 280px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .list input { margin: 10px; }
  .list .items { overflow-y: auto; flex: 1; }
  .item { padding: 7px 12px; cursor: pointer; border-left: 2px solid transparent; display: flex; justify-content: space-between; gap: 8px; }
  .item:hover { background: var(--bg2); }
  .item.on { background: var(--bg3); border-left-color: var(--accent); }
  .item small { color: var(--dim); font-family: var(--mono); }
  .form { flex: 1; overflow-y: auto; padding: 16px 24px; max-width: 760px; }
  .form h2 { font-size: 15px; margin: 0 0 12px; }
  .field { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: start; margin-bottom: 10px; }
  .field label { color: var(--dim); padding-top: 6px; }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; width: 100%; }
  textarea { font-family: var(--mono); min-height: 60px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.btn { background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  button.btn:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.danger { color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg3); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font: 12px var(--mono); display: inline-flex; gap: 6px; align-items: center; }
  .chip button { background: none; border: none; color: var(--dim); cursor: pointer; padding: 0; }
  .status { font: 600 11px var(--mono); padding: 1px 7px; border-radius: 999px; }
  .status.live { background: rgba(63,185,80,.15); color: var(--good); }
  .status.planned { background: var(--bg3); color: var(--dim); }
  .problems { margin-top: 14px; }
  .prob { font-size: 12px; padding: 4px 8px; border-left: 3px solid var(--bad); margin-bottom: 4px; background: rgba(248,81,73,.07); }
  .prob.warning { border-left-color: var(--warn); background: rgba(210,153,34,.07); }
  .prob code { color: var(--dim); }
  .overview { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .overview table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  .overview th, .overview td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .overview th { color: var(--dim); font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
  .overview h3 { margin: 22px 0 6px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  /* flow editor */
  .flow { flex: 1; display: flex; min-height: 0; }
  .palette { width: 190px; border-right: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .palette .tool { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: grab; background: var(--bg2); user-select: none; }
  .palette .tool b { display: block; }
  .palette .tool small { color: var(--dim); }
  .canvasWrap { flex: 1; position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--bg3) 1px, transparent 1px); background-size: 20px 20px; }
  .canvasWrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .flowTop { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-wrap: wrap; }
  .flowTop select { width: auto; min-width: 220px; }
  .side { width: 300px; border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; }
  .side h3 { margin: 0 0 8px; font-size: 13px; }
  .node rect.body { fill: var(--bg2); stroke: var(--border); stroke-width: 1.25; }
  .node.sel rect.body { stroke: var(--accent); stroke-width: 2; }
  .node.bad rect.body { stroke: var(--bad); stroke-width: 2; }
  .node text { fill: var(--text); font: 12px var(--sans); pointer-events: none; }
  .node text.kind { fill: var(--dim); font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .port { cursor: crosshair; }
  .port circle { stroke: var(--bg); stroke-width: 2; }
  .port text { fill: var(--dim); font: 11px var(--mono); }
  .edge { fill: none; stroke: #6e7681; stroke-width: 1.5; cursor: pointer; }
  .edge:hover, .edge.sel { stroke: var(--accent); stroke-width: 2.5; }
  .edgeLabel { fill: var(--purple); font: 10px var(--mono); }
  dialog { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 380px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .hint { color: var(--dim); font-size: 12px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--bg3); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; display: none; max-width: 480px; }
  @media (max-width: 860px) { .list { width: 200px; } .side { display: none; } .field { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Behaviour <span>definitions</span></h1>
  <span class="hint">drive → intention → plans → steps → activities</span>
  <span id="probBadge" class="badge">checking…</span>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="overview" class="on">All intentions</button>
  <button data-tab="drives">Drives</button>
  <button data-tab="intentions">Intentions</button>
  <button data-tab="plans">Action plans</button>
  <button data-tab="requirements">Requirements</button>
  <button data-tab="variables">Variables</button>
  <button data-tab="flow">Flow editor</button>
</nav>
<main>
  <section class="pane on" data-pane="overview"><div class="overview" id="overview"></div></section>
  <section class="pane" data-pane="drives"><div class="list"><input placeholder="Filter" data-filter="drives"><div class="items" data-items="drives"></div><div class="row" style="padding:10px"><button class="btn" data-new="drives">New drive</button></div></div><div class="form" data-form="drives"></div></section>
  <section class="pane" data-pane="intentions"><div class="list"><input placeholder="Filter" data-filter="intentions"><div class="items" data-items="intentions"></div><div class="row" style="padding:10px"><button class="btn" data-new="intentions">New intention</button></div></div><div class="form" data-form="intentions"></div></section>
  <section class="pane" data-pane="plans"><div class="list"><input placeholder="Filter" data-filter="plans"><div class="items" data-items="plans"></div><div class="row" style="padding:10px"><button class="btn" data-new="plans">New plan</button></div></div><div class="form" data-form="plans"></div></section>
  <section class="pane" data-pane="requirements"><div class="list"><input placeholder="Filter" data-filter="requirements"><div class="items" data-items="requirements"></div><div class="row" style="padding:10px"><button class="btn" data-new="requirements">New requirement</button></div></div><div class="form" data-form="requirements"></div></section>
  <section class="pane" data-pane="variables"><div class="list"><input placeholder="Filter" data-filter="variables"><div class="items" data-items="variables"></div><div class="row" style="padding:10px"><button class="btn" data-new="variables">New variable</button></div></div><div class="form" data-form="variables"></div></section>
  <section class="pane" data-pane="flow" style="flex-direction:column">
    <div class="flowTop">
      <label for="flowPlan" class="hint">Plan</label><select id="flowPlan"></select>
      <button class="btn primary" id="flowSave">Save plan</button>
      <button class="btn" id="flowRevert">Revert</button>
      <button class="btn" id="flowTidy">Tidy layout</button>
      <span class="hint">Drag a node kind onto the canvas. Drag from an output dot to a node to wire it. Click a wire or node and press Delete to remove it. Double-click a node to edit it.</span>
    </div>
    <div class="flow">
      <div class="palette" id="palette"></div>
      <div class="canvasWrap" id="canvasWrap"><svg id="canvas"></svg></div>
      <div class="side" id="side"></div>
    </div>
  </section>
</main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script type="module" src="/src/behaviour.js"></script>
</body>
</html>
