<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>Holosims Mesh Bank</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#1f2328;
    color:white;

    font-family:Arial;
}

#root{
    display:flex;
    width:100%;
    height:100%;
}

#sidebar{

    width:300px;

    background:#2a2f36;

    border-right:1px solid #444;

    overflow:auto;
}

#preview{

    flex:1;

    position:relative;
}

#canvas{
    width:100%;
    height:100%;
    display:block;
}

.section{

    padding:12px;

    border-bottom:1px solid #444;
}

.assetRow{

    padding:6px;

    cursor:pointer;

    border-bottom:1px solid #333;
}

.assetRow:hover{
    background:#3a414a;
}

.assetRow.active{
    background:#4c5c70;
}

label{
    display:block;
    margin-top:8px;
}

input{
    width:100%;
    padding:4px;
}

button{
    margin-top:8px;
    padding:6px;
}

#hierarchy{

    max-height:200px;
    overflow:auto;
    font-size:12px;
}

#anchors{

    max-height:150px;
    overflow:auto;
    font-size:12px;
}

#targets,
#bones{

    max-height:150px;

    overflow:auto;

    font-size:12px;
}

</style>

</head>

<body>

<div id="root">

    <div id="sidebar">

        <div class="section">

            <h3>Assets</h3>

            <select id="category">

                <option value="characters">
                    Characters
                </option>

                <option value="props">
                    Props
                </option>

                <option value="items">
                    Items
                </option>
                <option value="vehicles">
                    Vehicles
                </option>

                <option value="buildings">
                    Buildings
                </option>

                <option value="animations">
                    Animations
                </option>
            </select>
            <div class="section">

                <h3>Upload</h3>

                <input
                    type="file"
                    id="uploadFile">

                <button
                    id="uploadBtn">

                    Upload Asset

                </button>

</div>
        </div>

        <div
            id="assetList"
            class="section">
        </div>

        <div class="section">

            <h3>Metadata</h3>

            <label>
                Display Name
            </label>

            <input
                id="displayName">

            <label>
                Tags
            </label>
<h3>Interactions</h3>

<select id="interactionSelect">
</select>

<button id="addInteractionBtn">
Add Interaction
</button>

<button id="deleteInteractionBtn">
Delete Interaction
</button>

<hr>

<label>Name</label>
<input id="interactionName">

<label>Anchor</label>
<select id="interactionAnchor"></select>

<label>Target</label>
<select id="interactionTarget"></select>

<label>Max Distance</label>
<input
    id="interactionDistance"
    type="number"
    value="1"
>

<label>Required Item</label>
<input id="interactionItem">
            <input
                id="tags">

                
<h3>Transform</h3>

<label>Position X</label>
<input id="posX" type="number" step="0.01">

<label>Position Y</label>
<input id="posY" type="number" step="0.01">

<label>Position Z</label>
<input id="posZ" type="number" step="0.01">

<br><br>

<label>Rotation X</label>
<input id="rotX" type="number">

<label>Rotation Y</label>
<input id="rotY" type="number">

<label>Rotation Z</label>
<input id="rotZ" type="number">

<br><br>

<label>Scale X</label>
<input id="scaleX" type="number" step="0.01">

<label>Scale Y</label>
<input id="scaleY" type="number" step="0.01">

<label>Scale Z</label>
<input id="scaleZ" type="number" step="0.01">

<button id="resetTransformBtn">
Reset Transform
</button>

<h3>Placement</h3>

<label>Pivot</label>

<select id="pivot">

    <option value="bottom_center">
        Bottom Center
    </option>

    <option value="center">
        Center
    </option>

    <option value="top_center">
        Top Center
    </option>

    <option value="front_center">
        Front Center
    </option>

    <option value="rear_center">
        Rear Center
    </option>

</select>

<label>

<input
    type="checkbox"
    id="snapGround">

Snap To Ground

</label>

<label>

<input
    type="checkbox"
    id="snapGrid">

Snap To Grid

</label>
            <button
                id="saveMetaBtn">

                Save Metadata

            </button>
<button id="generateMetaBtn">
    Generate Metadata
</button>
        </div>
<h3>Bone Slots</h3>

<select id="slotSelect">
</select>

<button id="addSlotBtn">
Add Slot
</button>

<button id="deleteSlotBtn">
Delete Slot
</button>

<hr>

<label>Slot Name</label>

<input id="slotName">

<label>Bone</label>

<select id="slotBone">
</select>
        <div class="section">

            <h3>Animations</h3>

        <button id="frameBtn">
    Frame Model
</button>
            <div id="animations"></div>

        </div>


        <div class="section">

            <h3>Anchors</h3>

            <div id="anchors"></div>

        </div>
        <div class="section">
<div class="section">

    <h3>Targets</h3>

    <div id="targets"></div>

</div>

<div class="section">

    <h3>Bones</h3>

    <div id="bones"></div>

</div>
    <h3>Statistics</h3>

    <div id="stats">

        No model loaded

    </div>

</div>

        <div class="section">

            <h3>Hierarchy</h3>

            <div id="hierarchy"></div>

        </div>

    </div>

    <div id="preview">

        <canvas id="canvas"></canvas>

    </div>

</div>

<script
type="module"
src="/src/meshbank.js">
</script>

</body>

</html>
