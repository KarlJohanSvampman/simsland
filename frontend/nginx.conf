server {

    listen 80;

    server_name localhost;

    client_max_body_size 200m;

    root /usr/share/nginx/html;

    index index.html;

    location / {

        try_files $uri $uri/ =404;
    }

    # index.html (and the other bare HTML entry points -- editor.html,
    # character_creator.html, etc.) reference content-hashed asset
    # filenames that change on every build; nginx sets no Cache-Control
    # here by default, so browsers fall back to heuristic freshness and
    # can keep serving a stale HTML pointing at an asset hash that no
    # longer exists on disk for a long time after a new image deploys.
    # Explicit no-cache forces revalidation on every load -- negligible
    # cost, these files are tiny.
    location ~ \.html$ {

        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # ---- API gateway ---------------------------------------------------------------------------------
    # Every public route is served by the `api` service (backend/main.py with SIM_ROLE=api): a read
    # replica of the world (core/replication.py), every mutation sent to the simulation core as a command
    # (core/commands.py), and the few routes that need the core's in-process state (@core_only) relayed
    # to the core over HTTP by the gateway itself. The core (`backend`, SIM_ROLE=core) is not reachable
    # from here: it runs the tick and answers only the gateway. There are two gateways: `api` resolves to
    # both (Docker DNS) and nginx alternates between the addresses, moving on to the other one when a
    # connection fails or a gateway answers 502/503 (one that is restarting and has no world yet);
    # nginx only does that for requests that are safe to repeat (GET/HEAD/...), never for a POST.
    # The name is resolved per request so nginx starts even when both gateways are down.

    location ~ ^/(api|admin|debug|view|director|resources|mw|healthz)(/|$) {

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://api:8000;

        proxy_pass $gateway;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    location /ws {

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://api:8000;

        proxy_pass $gateway/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
