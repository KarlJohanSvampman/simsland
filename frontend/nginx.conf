server {

    listen 80;

    server_name localhost;

    client_max_body_size 200m;

    root /usr/share/nginx/html;

    index index.html;

    location / {

        try_files $uri $uri/ =404;
    }

    # index.html (and the other bare HTML entry points -- editor.html,
    # character_creator.html, etc.) reference content-hashed asset
    # filenames that change on every build; nginx sets no Cache-Control
    # here by default, so browsers fall back to heuristic freshness and
    # can keep serving a stale HTML pointing at an asset hash that no
    # longer exists on disk for a long time after a new image deploys.
    # Explicit no-cache forces revalidation on every load -- negligible
    # cost, these files are tiny.
    location ~ \.html$ {

        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /debug {

        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api {

        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # api/admin.py's whole router -- confirmed missing here (the frontend
    # has never actually been able to reach ANY /admin endpoint, only
    # direct curl/docker-exec calls to the backend container worked).
    # Long read timeout matches /api's own, since preview_mentality can
    # block on an LLM call.
    location /admin {

        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /resources {

        proxy_pass http://backend:8000;
    }
    location /view {

        proxy_pass http://backend:8000;
    }
    location /director {

        proxy_pass http://backend:8000;
    }
    # ---- API gateway (the `api` service: backend/core/replication.py + commands.py) -------------
    # A read replica of the core's world plus commands for every mutation. It takes the websocket
    # fan-out and the world-reading REST routes off the simulation process. Anything not listed here
    # (the editor, /admin, /debug, the middleware bridge, ...) still goes to the core, which also
    # serves every one of these routes itself: if the gateway is unreachable (502) or has no world
    # yet / the core is away (503) the request is retried against the core. 504 is deliberately not
    # retried: a command may already have run. The name is resolved per request so nginx starts
    # even when the gateway container is stopped.
    #
    # The editor, props and the asset/mesh/animation banks are here too: their reads come from the replica
    # or the shared files, their writes are commands (an editor save is a command carrying the whole world).
    #
    # Routes on the gateway must not read process-local state of the core (cognition stats, prompt
    # logs, the tick profile, LLM gate, the middleware heartbeat, sandbox worlds); keep those out.

    location ~ ^/(api/(household|overview|finances|dependents|events|conversation|editor|prop|meshbank|animbank|assets)|view|director)(/|$) {

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://api:8000;

        proxy_pass $gateway;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 3s;

        proxy_intercept_errors on;
        error_page 502 503 = @core;
    }

    location = /api/state {

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://api:8000;

        proxy_pass $gateway;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;

        proxy_intercept_errors on;
        error_page 502 503 = @core;
    }

    location /ws {

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://api:8000;

        proxy_pass $gateway/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @ws_core;
    }

    location @core {

        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location @ws_core {

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
    }
}
