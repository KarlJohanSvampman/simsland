server {

    listen 80;

    server_name localhost;

    client_max_body_size 200m;

    root /usr/share/nginx/html;

    index index.html;

    location / {

        try_files $uri $uri/ =404;
    }

    # index.html (and the other bare HTML entry points -- editor.html,
    # character_creator.html, etc.) reference content-hashed asset
    # filenames that change on every build; nginx sets no Cache-Control
    # here by default, so browsers fall back to heuristic freshness and
    # can keep serving a stale HTML pointing at an asset hash that no
    # longer exists on disk for a long time after a new image deploys.
    # Explicit no-cache forces revalidation on every load -- negligible
    # cost, these files are tiny.
    location ~ \.html$ {

        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /debug {

        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api {

        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /resources {

        proxy_pass http://backend:8000;
    }
    location /view {

        proxy_pass http://backend:8000;
    }
    location /ws {

        proxy_pass http://backend:8000/ws;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "Upgrade";
    }
}