<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HoloSims Template Registry</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #1b1f24;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

body {
  display: grid;
  grid-template-columns: 320px 1fr 420px;
  grid-template-rows: 100%;
}

/* ── LEFT SIDEBAR ───────────────────────────────── */

#sidebar {
  background: #252b33;
  border-right: 1px solid #444;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebarHeader {
  padding: 10px 12px;
  border-bottom: 1px solid #444;
  background: #1d2229;
}

#sidebarHeader h2 {
  margin: 0 0 8px 0;
  font-size: 15px;
}

#sidebarHeader button {
  margin-right: 4px;
}

#tabs {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid #444;
  max-height: 120px;
  overflow-y: auto;
}

.tab {
  padding: 7px 9px;
  cursor: pointer;
  background: #2e3640;
  border-right: 1px solid #333;
  border-bottom: 1px solid #333;
  font-size: 11px;
  white-space: nowrap;
}

.tab.active {
  background: #4a5665;
  color: #fff;
}

#templateActions {
  padding: 8px 10px;
  border-bottom: 1px solid #444;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

#templateList {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.templateRow {
  padding: 7px 8px;
  margin-bottom: 4px;
  background: #2c323a;
  cursor: pointer;
  border: 1px solid transparent;
  font-size: 13px;
}

.templateRow:hover {
  background: #3a424e;
}

.templateRow.active {
  border-color: #7ab4f5;
  background: #2e3e54;
}

/* ── CENTER EDITOR ──────────────────────────────── */

#editorPanel {
  background: #20242a;
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

#editorTitle {
  margin: 0 0 4px 0;
  font-size: 15px;
  color: #aac4f0;
}

#currentModelLabel {
  font-size: 12px;
  margin-bottom: 8px;
  color: #888;
  min-height: 16px;
}

#jsonEditor {
  flex: 1;
  width: calc(100% - 22px);
  min-height: calc(100vh - 130px);
  background: #111;
  color: #00ff99;
  border: 1px solid #444;
  padding: 10px;
  font-family: monospace;
  font-size: 13px;
  resize: none;
}

/* ── RIGHT PREVIEW ──────────────────────────────── */

#previewPanel {
  background: #1a1e24;
  border-left: 1px solid #444;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#previewHeader {
  padding: 8px 10px;
  background: #1d2229;
  border-bottom: 1px solid #444;
  font-size: 13px;
  font-weight: bold;
}

#modelPreview {
  height: 420px;
  border-bottom: 1px solid #444;
  overflow: hidden;
}

#animationList {
  max-height: 130px;
  overflow-y: auto;
  padding: 8px;
  border-bottom: 1px solid #444;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

#boneSlotPanel {
  padding: 8px 10px;
  border-bottom: 1px solid #444;
  max-height: 210px;
  overflow-y: auto;
}

#boneSlotPanel h3 {
  margin: 0 0 6px 0;
  font-size: 13px;
}

.boneSlotRow {
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.boneSlotRow label {
  font-size: 11px;
  width: 80px;
  flex-shrink: 0;
  color: #aaa;
}

.boneSlotRow select {
  flex: 1;
  background: #2a2f38;
  color: white;
  border: 1px solid #555;
  padding: 2px 4px;
  font-size: 11px;
}

#assetBrowserSection {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#assetBrowserHeader {
  padding: 8px 10px;
  border-bottom: 1px solid #444;
  background: #1d2229;
}

#assetBrowserHeader b {
  font-size: 12px;
  display: block;
  margin-bottom: 5px;
}

#assetSearch {
  width: calc(100% - 12px);
  padding: 5px 6px;
  background: #2a2f38;
  border: 1px solid #555;
  color: white;
  font-size: 12px;
}

#assetBrowser {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.assetCategory {
  font-size: 11px;
  color: #6699cc;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 8px 0 4px 0;
  padding-bottom: 2px;
  border-bottom: 1px solid #333;
}

.assetRow {
  padding: 6px 8px;

.assetRow {
  padding: 6px 8px;
  background: #2c323a;
  margin-bottom: 3px;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 3px;
}

.assetRow:hover {
  background: #3a4553;
  border-color: #556;
}

.assetName {
  font-size: 12px;
  color: #ddeeff;
}

.assetId {
  font-size: 10px;
  color: #6688aa;
  margin-top: 1px;
}

button {
  margin: 3px 3px 3px 0;
  padding: 6px 10px;
  background: #3d4754;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 12px;
}

button:hover {
  background: #556170;
}

.animButton {
  padding: 4px 8px;
  font-size: 11px;
  background: #2a3340;
}

#statusBar {
  padding: 6px 10px;
  background: #16191d;
  border-top: 1px solid #444;
  font-size: 11px;
  color: #888;
  flex-shrink: 0;
}

</style>
</head>

<body>

<!-- ── LEFT SIDEBAR ─────────────────────────────── -->

<aside id="sidebar">

  <div id="sidebarHeader">
    <h2>Template Registry</h2>
    <button onclick="window.location='/'">Viewer</button>
    <button onclick="window.location='/editor.html'">World</button>
    <button onclick="window.location='/meshbank.html'">Meshbank</button>
  </div>

  <div id="tabs"></div>

  <div id="templateActions">
    <button onclick="createTemplate()">New</button>
    <button onclick="duplicateTemplate()">Duplicate</button>
    <button onclick="deleteTemplate()">Delete</button>
    <button onclick="saveDefinitions()">Save</button>
  </div>

  <div id="templateList"></div>

</aside>

<!-- ── CENTER EDITOR ────────────────────────────── -->

<main id="editorPanel">

  <h2 id="editorTitle">Select a template</h2>

  <div id="currentModelLabel"></div>

  <textarea id="jsonEditor" placeholder="Template JSON will appear here"></textarea>

</main>

<!-- ── RIGHT PREVIEW ────────────────────────────── -->

<aside id="previewPanel">

  <div id="previewHeader">Asset / Animation Preview</div>

  <div id="modelPreview"></div>

  <div id="animationList"></div>

  <div id="boneSlotPanel">
    <h3>Bone Slots</h3>
    <div id="boneSlotEditor"></div>
  </div>

  <div id="assetBrowserSection">
    <div id="assetBrowserHeader">
      <b>Meshbank Assets</b>
      <input id="assetSearch" type="text" placeholder="Search assets..." />
    </div>
    <div id="assetBrowser"></div>
  </div>

  <div id="statusBar">Ready</div>

</aside>

<script type="module" src="/src/definitions.js"></script>

</body>
</html>
