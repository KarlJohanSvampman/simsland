<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simsland</title>
  <style>
    body { margin:0; overflow:hidden; background:#111; color:#eee; font-family:system-ui, sans-serif; }
    #overlay {backdrop-filter: blur(6px);border: 1px solid rgba(255,255,255,0.1);}    
    #panel { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.72); padding:12px; border-radius:8px; width:350px; max-height:90vh; overflow:auto; font-size:13px; }
    .bubble { position:absolute; transform:translate(-50%,-100%); background:#fff; color:#111; border-radius:12px; padding:4px 8px; font-size:12px; pointer-events:none; max-width:240px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
    .label { position:absolute; transform:translate(-50%,-100%); color:#fff; text-shadow:0 1px 4px #000; font-size:13px; font-weight:700; pointer-events:none; }
    #viewerInspector {

    position: fixed;

    top: 10px;
    right: 10px;

    width: 260px;
    max-height: 85vh;

    background: rgba(0,0,0,0.85);

    color: white;

    padding: 12px;

    z-index: 9999;

    font-family: monospace;

    border: 1px solid #444;

    overflow-y: auto;
    box-sizing: border-box;
  }

  #viewerInspector.expanded {
    width: 480px;
  }

  #debugSettingsBtn {
    position: fixed;
    top: 10px;
    right: 280px;
    z-index: 9999;
    width: 34px;
    height: 34px;
    background: rgba(0,0,0,0.85);
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  #debugSettingsBtn:hover {
    background: rgba(40,40,40,0.9);
  }

  #viewerInspector pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(255,255,255,0.06);
    padding: 6px;
    border-radius: 4px;
    max-height: 240px;
    overflow-y: auto;
    font-size: 11px;
  }

  /* =========================
     MODALS
     Ported from editor.html — the live viewer had no modal
     infrastructure until the mailbox household-admin panel needed one.
  ========================= */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: #1e2229;
    border: 1px solid #555;
    border-radius: 4px;
    width: 420px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .modal-header {
    padding: 12px 16px;
    background: #2a2f38;
    border-bottom: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 {
    margin: 0;
    font-size: 15px;
  }

  .modal-close {
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }

  .modal-close:hover {
    color: white;
  }

  .modal-body {
    overflow-y: auto;
    flex: 1;
    padding: 12px 16px;
    font-size: 13px;
  }

  .modal-body h4 {
    margin: 14px 0 6px;
    font-size: 12px;
    color: #9ab;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .modal-body input, .modal-body select {
    background: #262b33;
    border: 1px solid #444;
    color: #eee;
    padding: 6px 8px;
    border-radius: 3px;
    font-size: 13px;
  }

  .modal-body button {
    background: #3a4250;
    border: 1px solid #555;
    color: #eee;
    padding: 5px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
  }

  .modal-body button:hover {
    background: #4a5464;
  }

  .modal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #333;
  }

  .modal-empty {
    color: #777;
    font-size: 13px;
    padding: 12px 0;
  }

  </style>
</head>
<body>

<div id="viewerInspector">

  <h3>Inspector</h3>

  <div id="viewerSelection">
    Nothing selected
  </div>

</div>

<button id="debugSettingsBtn" title="Debug overlay settings">⚙</button>

<div class="modal-overlay" id="modal-household">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="householdModalTitle">Household</h3>
      <button class="modal-close" onclick="closeModal('modal-household')">✕</button>
    </div>
    <div class="modal-body" id="householdModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-debug-settings">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Debug Overlay Settings</h3>
      <button class="modal-close" onclick="closeModal('modal-debug-settings')">✕</button>
    </div>
    <div class="modal-body" id="debugSettingsModalBody"></div>
  </div>
</div>

  <canvas id="c"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
