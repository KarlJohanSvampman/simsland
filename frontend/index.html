<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simsland</title>
  <style>
    body { margin:0; overflow:hidden; background:#111; color:#eee; font-family:system-ui, sans-serif; }
    #overlay {backdrop-filter: blur(6px);border: 1px solid rgba(255,255,255,0.1);}    
    #panel { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.72); padding:12px; border-radius:8px; width:350px; max-height:90vh; overflow:auto; font-size:13px; }
    .bubble { position:absolute; transform:translate(-50%,-100%); background:#fff; color:#111; border-radius:12px; padding:4px 8px; font-size:12px; pointer-events:none; max-width:240px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
    .label { position:absolute; transform:translate(-50%,-100%); color:#fff; text-shadow:0 1px 4px #000; font-size:13px; font-weight:700; pointer-events:none; }
    #viewerInspector {

    position: fixed;

    top: 10px;
    right: 10px;

    width: 260px;
    max-height: 85vh;

    background: rgba(0,0,0,0.85);

    color: white;

    padding: 12px;

    z-index: 9999;

    font-family: monospace;

    border: 1px solid #444;

    overflow-y: auto;
    box-sizing: border-box;
  }

  #viewerInspector.expanded {
    width: 480px;
  }

  .hidden { display: none !important; }

  #viewerTabs {
    display: flex;
    gap: 4px;
    margin: 6px 0 10px;
  }

  #viewerTabs button {
    flex: 1;
    background: #2a2e36;
    border: 1px solid #444;
    color: #ccc;
    padding: 4px 6px;
    font-size: 11px;
    font-family: monospace;
    cursor: pointer;
    border-radius: 3px;
  }

  #viewerTabs button.active {
    background: #3a4250;
    color: #fff;
    border-color: #6cf;
  }

  #viewerEffectIcons {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 0 0 10px;
  }

  #viewerEffectIcons .effectIcon {
    font-size: 16px;
    line-height: 1;
    padding: 3px 5px;
    background: #2a2e36;
    border: 1px solid #444;
    border-radius: 4px;
    cursor: default;
  }

  #viewerBodyTab svg {
    display: block;
    margin: 0 auto 8px;
    width: 100%;
    max-width: 160px;
  }

  #viewerBodyTab .bodyPartRow {
    padding: 4px 0;
    border-bottom: 1px solid #333;
    font-size: 12px;
  }

  #viewerBodyTab .bodyPartRow .partName {
    font-weight: bold;
    text-transform: capitalize;
  }

  #viewerBodyTab .bodySummary {
    font-size: 12px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #444;
  }

  #viewerBodyTab .diseaseList {
    font-size: 12px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #444;
  }

  #debugSettingsBtn {
    position: fixed;
    top: 10px;
    right: 280px;
    z-index: 9999;
    width: 34px;
    height: 34px;
    background: rgba(0,0,0,0.85);
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  #debugSettingsBtn:hover {
    background: rgba(40,40,40,0.9);
  }

  /* =========================
     EVENT TIMELINE
     Hideable horizontal bar under the top icon row -- see
     api/events.py (GET /api/events) for the data this renders.
  ========================= */

  #timelineToggleBtn {
    position: fixed;
    top: 10px;
    right: 324px;
    z-index: 9999;
    width: 34px;
    height: 34px;
    background: rgba(0,0,0,0.85);
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  #timelineToggleBtn:hover {
    background: rgba(40,40,40,0.9);
  }

  #eventTimeline {
    position: fixed;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    height: 56px;
    background: rgba(0,0,0,0.82);
    border-bottom: 1px solid #444;
    z-index: 9000;
    font-family: monospace;
    color: white;
    box-sizing: border-box;
    padding: 6px 16px;
  }

  #eventTimelineTrack {
    position: relative;
    height: 26px;
    margin: 2px 0;
  }

  #eventTimelineAxis {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #444;
  }

  #eventTimelinePoints {
    position: absolute;
    inset: 0;
  }

  .eventTimelinePoint {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #6cf;
    border: 1px solid #0a1a24;
    transform: translate(-50%, -50%);
    cursor: pointer;
  }

  .eventTimelinePoint:hover {
    background: #9df;
  }

  .eventTimelinePoint.eventTimelinePointCluster {
    width: 13px;
    height: 13px;
    background: #fc6;
  }

  .eventTimelinePoint.eventTimelinePointCluster:hover {
    background: #fd9;
  }

  .eventTimelineLabels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #999;
  }

  #eventTimelineTooltip {
    position: fixed;
    z-index: 9500;
    background: rgba(0,0,0,0.92);
    color: white;
    border: 1px solid #444;
    padding: 8px 10px;
    font-family: monospace;
    font-size: 12px;
    max-width: 280px;
    display: none;
    pointer-events: none;
  }

  #eventTimelineTooltip .eventTimelineTooltipRow + .eventTimelineTooltipRow {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #333;
  }

  #eventTimelineTooltip .eventTimelineTooltipTitle {
    color: #9cf;
    font-weight: bold;
  }

  #eventTimelineTooltip .eventTimelineTooltipMeta {
    color: #888;
    font-size: 11px;
  }

  .eventModalRow + .eventModalRow {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #333;
  }

  .eventModalRowTitle {
    color: #9cf;
    font-weight: bold;
    font-size: 14px;
  }

  .eventModalRowMeta {
    color: #888;
    font-size: 11px;
    margin: 2px 0 6px;
  }

  .eventModalRowSummary {
    color: #ddd;
    line-height: 1.4;
  }

  /* =========================
     OUTLINER SIDEBAR
     Collapsible left-docked Blender-outliner-style tree -- see
     api/household.py (GET /household/list, GET /household/characters)
     for the data this renders.
  ========================= */

  #outlinerToggleBtn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 9999;
    width: 34px;
    height: 34px;
    background: rgba(0,0,0,0.85);
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  #outlinerToggleBtn:hover {
    background: rgba(40,40,40,0.9);
  }

  #outlinerSidebar {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 260px;
    background: rgba(0,0,0,0.82);
    border-right: 1px solid #444;
    z-index: 9000;
    font-family: monospace;
    color: white;
    box-sizing: border-box;
    padding: 8px;
    overflow-y: auto;
  }

  #outlinerSearch {
    width: 100%;
    box-sizing: border-box;
    background: #1a1a1a;
    border: 1px solid #444;
    color: #eee;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 8px;
  }

  .outlinerGroup {
    margin-bottom: 2px;
  }

  .outlinerGroupHeader {
    cursor: pointer;
    font-weight: bold;
    color: #9cf;
    padding: 3px 2px;
    user-select: none;
  }

  .outlinerGroupHeader:hover {
    color: #cdf;
  }

  .outlinerGroupCount {
    color: #678;
    font-weight: normal;
    font-size: 11px;
  }

  .outlinerMembers {
    padding-left: 14px;
  }

  .outlinerMembers.collapsed {
    display: none;
  }

  .outlinerRow {
    padding: 3px 4px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .outlinerRow:hover {
    background: rgba(255,255,255,0.08);
  }

  .outlinerRow.selected {
    background: rgba(100,180,255,0.22);
  }

  .outlinerRowName {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .outlinerRowStatus {
    color: #999;
    font-size: 11px;
    white-space: nowrap;
  }

  .outlinerRowStatus.offgrid { color: #fc6; }
  .outlinerRowStatus.traveling { color: #6cf; }
  .outlinerRowStatus.dead { color: #f66; }

  .outlinerEmpty {
    color: #777;
    font-size: 12px;
    padding: 8px 2px;
  }

  #viewerInspector pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: rgba(255,255,255,0.06);
    padding: 6px;
    border-radius: 4px;
    max-height: 240px;
    overflow-y: auto;
    font-size: 11px;
  }

  /* =========================
     MODALS
     Ported from editor.html — the live viewer had no modal
     infrastructure until the mailbox household-admin panel needed one.
  ========================= */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: #1e2229;
    border: 1px solid #555;
    border-radius: 4px;
    width: 420px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .modal-header {
    padding: 12px 16px;
    background: #2a2f38;
    border-bottom: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 {
    margin: 0;
    font-size: 15px;
  }

  .modal-close {
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }

  .modal-close:hover {
    color: white;
  }

  .modal-body {
    overflow-y: auto;
    flex: 1;
    padding: 12px 16px;
    font-size: 13px;
  }

  .modal-body h4 {
    margin: 14px 0 6px;
    font-size: 12px;
    color: #9ab;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .modal-body input, .modal-body select {
    background: #262b33;
    border: 1px solid #444;
    color: #eee;
    padding: 6px 8px;
    border-radius: 3px;
    font-size: 13px;
  }

  .modal-body button {
    background: #3a4250;
    border: 1px solid #555;
    color: #eee;
    padding: 5px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
  }

  .modal-body button:hover {
    background: #4a5464;
  }

  .modal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #333;
  }

  .modal-empty {
    color: #777;
    font-size: 13px;
    padding: 12px 0;
  }

  </style>
</head>
<body>

<div id="viewerInspector">

  <h3>Inspector</h3>

  <div id="viewerTabs">
    <button id="viewerTabStatus" class="active" data-tab="status">Status</button>
    <button id="viewerTabBody" data-tab="body">Body</button>
  </div>

  <div id="viewerEffectIcons"></div>

  <div id="viewerSelection">
    Nothing selected
  </div>

  <div id="viewerBodyTab" class="hidden">
    <svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
      <circle id="bodypart-head" cx="60" cy="20" r="14" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-neck" x="53" y="32" width="14" height="10" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-left_arm"  x="16" y="44" width="16" height="68" rx="4" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-right_arm" x="88" y="44" width="16" height="68" rx="4" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-chest"   x="38" y="42" width="44" height="38" rx="3" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-abdomen" x="41" y="80" width="38" height="26" rx="3" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-pelvis"  x="39" y="106" width="42" height="18" rx="3" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-left_leg"  x="42" y="124" width="16" height="82" rx="4" stroke="#222" stroke-width="1"/>
      <rect   id="bodypart-right_leg" x="62" y="124" width="16" height="82" rx="4" stroke="#222" stroke-width="1"/>
    </svg>
    <div id="bodyTabSummary" class="bodySummary"></div>
    <div id="bodyTabRows"></div>
    <div id="bodyTabDiseases" class="diseaseList"></div>
  </div>

</div>

<button id="debugSettingsBtn" title="Debug overlay settings">⚙</button>
<button id="timelineToggleBtn" title="Toggle event timeline">🕒</button>
<button id="outlinerToggleBtn" title="Toggle outliner">☰</button>

<div id="outlinerSidebar">
  <input id="outlinerSearch" type="text" placeholder="Search households / characters..." />
  <div id="outlinerTree"></div>
</div>

<div id="eventTimeline">
  <div id="eventTimelineTrack">
    <div id="eventTimelineAxis"></div>
    <div id="eventTimelinePoints"></div>
  </div>
  <div class="eventTimelineLabels">
    <span id="eventTimelineLabelLeft">—</span>
    <span id="eventTimelineLabelRight">now</span>
  </div>
</div>

<div id="eventTimelineTooltip"></div>

<div class="modal-overlay" id="modal-household">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="householdModalTitle">Household</h3>
      <button class="modal-close" onclick="closeModal('modal-household')">✕</button>
    </div>
    <div class="modal-body" id="householdModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-debug-settings">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Debug Overlay Settings</h3>
      <button class="modal-close" onclick="closeModal('modal-debug-settings')">✕</button>
    </div>
    <div class="modal-body" id="debugSettingsModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-event">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="eventModalTitle">Event</h3>
      <button class="modal-close" onclick="closeModal('modal-event')">✕</button>
    </div>
    <div class="modal-body" id="eventModalBody"></div>
  </div>
</div>

  <canvas id="c"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
