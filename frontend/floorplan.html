<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floorplan Designer</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #1b1f24;
  color: white;
  font-family: Arial, sans-serif;
}

#root {
  display: flex;
  width: 100vw;
  height: 100vh;
}

#toolbar {
  width: 260px;
  background: #252b33;
  border-right: 1px solid #444;
  padding: 10px;
  overflow-y: auto;
  flex-shrink: 0;
}

#canvasContainer {
  flex: 1;
  position: relative;
  background: #111;
  overflow: hidden;
  cursor: crosshair;
}

#canvasHint {
  position: absolute;
  bottom: 8px;
  left: 8px;
  font-size: 11px;
  color: #666;
  pointer-events: none;
}

#sidepanel {
  width: 280px;
  background: #252b33;
  border-left: 1px solid #444;
  overflow-y: auto;
  padding: 10px;
  flex-shrink: 0;
}

button {
  width: 100%;
  margin-bottom: 6px;
  padding: 8px 10px;
  border: none;
  background: #3a4552;
  color: white;
  cursor: pointer;
  text-align: left;
  font-size: 13px;
}

button:hover { background: #4d5a69; }
button.active { background: #5588bb; }
button.danger { background: #7a2222; }
button.danger:hover { background: #993333; }

input, select, textarea {
  width: 100%;
  margin-bottom: 8px;
  background: #111;
  color: white;
  border: 1px solid #444;
  padding: 6px;
  box-sizing: border-box;
  font-size: 13px;
}

canvas {
  display: block;
  background: #181818;
}

.roomRow {
  background: #333;
  padding: 8px;
  margin-bottom: 6px;
  border-radius: 3px;
  font-size: 12px;
}

.roomRow .roomRowType {
  font-size: 11px;
  color: #aaa;
}

.roomRow button {
  width: auto;
  padding: 3px 8px;
  margin: 4px 4px 0 0;
  font-size: 11px;
  background: #555;
}

#status {
  margin-top: 10px;
  font-size: 11px;
  color: #888;
  padding: 4px;
}

.section {
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid #333;
}

.section h3 {
  margin: 0 0 8px 0;
  font-size: 12px;
  text-transform: uppercase;
  color: #889;
  letter-spacing: 0.05em;
}

.section h2 {
  margin: 0 0 10px 0;
  font-size: 14px;
}

#roomModeIndicator {
  display: none;
  background: #335533;
  color: #88ff88;
  padding: 6px 10px;
  margin-bottom: 8px;
  font-size: 12px;
  border-radius: 3px;
  text-align: center;
}

#roomModeIndicator.active {
  display: block;
}

#roomCreateForm {
  display: none;
  background: #1e2530;
  border: 1px solid #445;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 4px;
}

#roomCreateForm h4 {
  margin: 0 0 8px 0;
  font-size: 12px;
  color: #aac;
}

#roomCreateForm label {
  display: block;
  font-size: 11px;
  color: #889;
  margin-bottom: 2px;
}

#propSpawnForm {
  display: none;
  background: #1e2530;
  border: 1px solid #445;
  padding: 8px;
  margin-top: 8px;
  font-size: 12px;
  border-radius: 4px;
}

.propSpawnRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #333;
  padding: 5px 8px;
  margin-bottom: 4px;
  border-radius: 3px;
  font-size: 12px;
}

.propSpawnRow button {
  width: auto;
  padding: 2px 6px;
  margin: 0;
  font-size: 11px;
  background: #662222;
}

hr { border-color: #333; margin: 12px 0; }

h2 { font-size: 15px; margin: 0 0 10px 0; }
</style>
</head>
<body>

<div id="root">

  <!-- ===== LEFT TOOLBAR ===== -->
  <div id="toolbar">

    <div class="section">
      <h3>Paint Tools</h3>

      <button class="toolBtn active" data-tool="tile">🔲 Tile</button>
      <select id="tileTemplateSelect"></select>

      <button class="toolBtn" data-tool="wall">🧱 Wall</button>
      <button class="toolBtn" data-tool="door">🚪 Door</button>
      <button class="toolBtn" data-tool="window">🪟 Window</button>
      <button class="toolBtn" data-tool="staircase">🪜 Staircase</button>
      <button class="toolBtn" data-tool="erase">🗑 Erase</button>
    </div>

    <div class="section">
      <h3>Wall Material</h3>
      <select id="materialSelect"></select>
    </div>

    <div class="section">
      <h3>Prop Spawns</h3>
      <button class="toolBtn" data-tool="prop">📦 Place Prop</button>

      <div id="propSpawnForm">
        <label>Prop Template</label>
        <select id="propTemplateSelect"></select>
        <label>Rotation (0–3 quarter turns)</label>
        <select id="propRotationSelect">
          <option value="0">0° North</option>
          <option value="1">90° East</option>
          <option value="2">180° South</option>
          <option value="3">270° West</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h3>Room Tools</h3>

      <button id="roomModeBtn">☑ Room Select Mode</button>
      <button id="autoDetectRoomsBtn">⚡ Auto-Detect Rooms</button>
    </div>

    <div class="section">
      <h3>Floorplan</h3>

      <label style="font-size:11px;color:#889">Template ID</label>
      <input id="floorplanId" placeholder="starter_house" value="starter_house" />

      <label style="font-size:11px;color:#889">Width (tiles)</label>
      <input id="floorplanWidth" type="number" value="20" min="4" max="200" />

      <label style="font-size:11px;color:#889">Height (tiles)</label>
      <input id="floorplanHeight" type="number" value="20" min="4" max="200" />

      <button id="newFloorplanBtn">New Floorplan</button>
      <button id="saveFloorplanBtn">💾 Save</button>
      <button id="loadFloorplanBtn">📂 Load</button>
    </div>

    <div id="status">Ready</div>

  </div>

  <!-- ===== CANVAS ===== -->
  <div id="canvasContainer">
    <canvas id="floorCanvas"></canvas>
    <div id="canvasHint">Scroll to zoom · Middle-drag or Right-drag to pan · Right-click erases</div>
  </div>

  <!-- ===== SIDE PANEL ===== -->
  <div id="sidepanel">

    <div id="roomModeIndicator">Room Select Mode — click tiles</div>

    <!-- Room creation form (shown in room mode) -->
    <div id="roomCreateForm">
      <h4>Create Room from Selection</h4>

      <label>Room Type</label>
      <select id="roomTypeSelect">
        <option value="living_room">Living Room</option>
        <option value="bedroom">Bedroom</option>
        <option value="kitchen">Kitchen</option>
        <option value="dining_room">Dining Room</option>
        <option value="restroom">Restroom / Bathroom</option>
        <option value="home_office">Home Office</option>
        <option value="corridor">Corridor / Hallway</option>
        <option value="main_entrance">Main Entrance</option>
        <option value="secondary_exit">Secondary Exit</option>
        <option value="storage">Storage</option>
        <option value="garage">Garage</option>
        <option value="laundry">Laundry</option>
        <option value="room">Generic Room</option>
      </select>

      <label>Tags (comma separated)</label>
      <input id="roomTagsInput" type="text" placeholder="private, ground_floor" />

      <button id="confirmRoomBtn">✔ Confirm Room</button>
      <button id="cancelRoomBtn" class="danger">✕ Cancel</button>
    </div>

    <h2>Rooms</h2>
    <div id="roomList"></div>

    <hr />

    <h2>Selection</h2>
    <div id="selectionInfo">None</div>

    <hr />

    <h2>Prop Spawns</h2>
    <div id="propSpawnList"></div>

  </div>

</div>

<script type="module" src="/src/floorplan.js"></script>

</body>
</html>
