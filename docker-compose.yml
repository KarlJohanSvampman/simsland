version: "3.9"

services:
  backend:
    build: ./backend
    container_name: sim-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sim
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://192.168.0.7:11434  # 👈 your remote Ollama
      - OLLAMA_MODEL=llama3.1:latest
      - OLLAMA_NUM_CTX=8192          # 👈 explicit context window (was implicit 4096)
      - OLLAMA_KEEP_ALIVE=10m        # 👈 reduce cold-start reloads between ticks
      - OLLAMA_MAX_CONCURRENCY=2     # 👈 tune to what the Ollama host can actually parallelize
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./resources:/resources   # 👈 important for models/assets
      - ./simulations:/data/simulations
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: sim-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  redis:
    image: redis:7
    container_name: sim-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: