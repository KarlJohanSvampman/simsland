version: "3.9"

services:
  backend:
    build: ./backend
    container_name: sim-backend
    restart: unless-stopped
    mem_limit: 3g                 # hard cap; core/memory_guard.py exits cleanly (soft 1.5GB / hard 2.6GB RSS) before the kernel OOM-kills
    memswap_limit: 3g
    ports:
      - "8002:8000"                  # the core's own (ops-only) HTTP server; the public API is the `api` service on :8000
    environment:
      - SIM_ROLE=core                # the tick, the command consumer, the replica publisher; serves only @core_only routes
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sim
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://192.168.10.203:11434  # 👈 your remote Ollama
      - OLLAMA_MODEL=llama3.1:latest
      - OLLAMA_NUM_CTX=8192          # 👈 explicit context window (was implicit 4096)
      - OLLAMA_KEEP_ALIVE=10m        # 👈 reduce cold-start reloads between ticks
      - OLLAMA_MAX_CONCURRENCY=2     # 👈 raised back from 1 -- the priority queue (llm/llm_gate.py) now protects urgent calls with preemption even at concurrency>1, so strict single-flight is no longer needed to keep decisions responsive, and it was directly bottlenecking tick throughput with 4 characters all needing decisions
      - LLM_CALL_MAX_WAIT_SECONDS=90   # hard cap on any thread blocked on the LLM (llm/llm_gate.py)
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./resources:/resources   # 👈 important for models/assets
      - ./simulations:/data/simulations
      - ./frontend/nginx.conf:/frontend/nginx.conf:ro   # read by tools/route_audit.py (which routes go to the gateway)
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Cognition worker: the model round-trip for character decisions, off the simulation core's
  # process (backend/workers/cognition.py). The core uses it while its heartbeat is current and
  # runs decisions in-process otherwise, so stopping this never stalls the sim.
  #   docker compose up -d --scale cognition=2      (OLLAMA_MAX_CONCURRENCY applies per worker)
  # Bind-mounted like the backend; restart it after editing brain/ or llm/ code.
  cognition:
    build: ./backend
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://192.168.10.203:11434
      - OLLAMA_MODEL=llama3.1:latest
      - OLLAMA_NUM_CTX=8192
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_MAX_CONCURRENCY=2
      - LLM_CALL_MAX_WAIT_SECONDS=90
      - COGNITION_WORKER_THREADS=8
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./resources:/resources
    command: python -m workers.cognition

  # Background-LLM worker: the one-off model calls the sim fires and collects later (theories,
  # child imagination, account comparisons, household narration, self-assessments --
  # backend/workers/bg_llm.py). Same fallback rule as cognition: the core runs them itself
  # whenever no worker is alive.   docker compose up -d --scale bg_llm=2
  bg_llm:
    build: ./backend
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - REDIS_HOST=redis
      - OLLAMA_BASE_URL=http://192.168.10.203:11434
      - OLLAMA_MODEL=llama3.1:latest
      - OLLAMA_NUM_CTX=8192
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_MAX_CONCURRENCY=1
      - LLM_CALL_MAX_WAIT_SECONDS=90
      - BG_LLM_WORKER_THREADS=4
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./resources:/resources
    command: python -m workers.bg_llm

  # API gateway: the public face of the simulation. Serves every route and the websocket from a read
  # replica of the core's world (backend/core/replication.py), sends every mutation to the core as a
  # command (backend/core/commands.py) and relays the few routes that need the core's in-process state
  # (@core_only) to it over HTTP. It runs no tick. The core is the `backend` service (SIM_ROLE=core).
  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 2g
    deploy:
      replicas: 2                    # two gateways: nothing in one is unique (a replica, a relay), so either can serve
                                     # any request and one can be restarted while the other answers. nginx (in `frontend`)
                                     # spreads requests over both through Docker's DNS name `api`.
    environment:
      - SIM_ROLE=api
      - CORE_URL=http://backend:8000   # where @core_only routes are relayed
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sim
      - REDIS_HOST=redis
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app
      - ./resources:/resources
      - ./simulations:/data/simulations
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:                       # 503 until the world replica has synced with the core
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: sim-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                    # the game
      - "8000:80"                    # the API and websocket at the address the page's scripts use (location.hostname:8000)
    depends_on:
      - api
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  redis:
    image: redis:7
    container_name: sim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: