<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HoloSims Architecture Map</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020810;overflow:hidden;font-family:'Cascadia Code','Fira Code',monospace}
  canvas{display:block}
  #ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
  #topbar{position:absolute;top:0;left:0;right:0;padding:12px 20px;background:linear-gradient(to bottom,rgba(2,8,16,.9),transparent);display:flex;align-items:center;gap:14px}
  #topbar h1{color:#58a6ff;font-size:14px;font-weight:700;letter-spacing:.3px}
  #topbar p{color:#8b949e;font-size:11px}
  #info{position:absolute;bottom:20px;right:20px;width:330px;max-height:70vh;background:rgba(13,17,23,.95);border:1px solid #30363d;border-radius:10px;padding:16px;overflow-y:auto;transition:opacity .2s;pointer-events:auto}
  #info.hidden{opacity:0;pointer-events:none}
  #info h2{color:#c9d1d9;font-size:13px;font-weight:700;margin-bottom:3px}
  #info .gtype{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8b949e;margin-bottom:8px}
  #info .gdesc{color:#8b949e;font-size:11.5px;line-height:1.65;margin-bottom:10px}
  #info .mod{background:rgba(33,38,45,.8);border:1px solid #21262d;border-radius:5px;padding:7px 10px;margin-bottom:5px}
  #info .mname{font-size:11px;font-weight:700;font-family:monospace}
  #info .mdesc{color:#8b949e;font-size:10.5px;margin-top:3px;line-height:1.5}
  #legend{position:absolute;top:60px;left:18px;display:flex;flex-direction:column;gap:6px}
  .li{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#8b949e;cursor:pointer;padding:3px 6px;border-radius:4px;transition:background .1s}
  .li:hover{background:rgba(88,166,255,.08);color:#c9d1d9}
  .ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  #hint{position:absolute;bottom:20px;left:20px;color:#8b949e;font-size:10.5px;line-height:1.9}
</style>
</head>
<body>
<div id="ui">
  <div id="topbar">
    <h1>🧠 HoloSims Architecture</h1>
    <p>Click a node to expand · Hover for details · Drag to orbit · Scroll to zoom</p>
  </div>
  <div id="legend"></div>
  <div id="info" class="hidden"></div>
  <div id="hint">⬡ Click group: expand/collapse modules<br>🔗 Lines show system dependencies<br>🖱 Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ── Architecture data ─────────────────────────────────────────────────────────
const GROUPS = [
{
  id:'core', label:'Core', color:'#58a6ff',
  pos:[0,0,0],
  desc:'Heartbeat of the simulation. sim_loop.py drives every other system on a cadence schedule. event_bus.py decouples systems via synchronous pub/sub. db.py persists the single world dict to PostgreSQL with Redis as a write-through cache. schema_defaults.py ensures every new field has a safe zero-value before systems read it. Everything else is called from here.',
  connects_to:['brain','social','economy','physical','society','api'],
  modules:[
    {id:'sim_loop',    label:'sim_loop.py',      color:'#58a6ff', desc:'Main tick function. Calls every system on its CADENCE slot (update_market + update_stocks on MEDIUM/offset=9, update_investment_behavior per character on SLOW/offset=20, update_deliveries on offset=6), advances the wall-clock calendar, then flushes the event bus. The only place that decides WHEN systems run.'},
    {id:'event_bus',   label:'event_bus.py',      color:'#58a6ff', desc:'In-process pub/sub. emit() queues events; flush() delivers to all subscribers once per tick. Handlers may emit new events (one recursive level). Replaces "run every tick just in case" polling.'},
    {id:'event_handlers',label:'event_handlers.py',color:'#58a6ff',desc:'All subscriptions wired at import time. Maps event types to handlers: bills_overdue→evict, incident_created→auto_report, character_fired→apply_for_job, confrontation_desired→start_conflict, etc.'},
    {id:'tick_sched',  label:'tick_schedule.py',  color:'#58a6ff', desc:'every(world, n, offset) helper + CADENCE dict. All cadence numbers live here. Offsets stagger systems so nothing fires simultaneously. FAST=5, MEDIUM=15-20, SLOW=30-60, VERY_SLOW=300.'},
    {id:'db',          label:'db.py',             color:'#58a6ff', desc:'PostgreSQL persistence + Redis cache. load_world() checks Redis first, falls back to DB and caches on load. save_world() writes both. World stored as a single JSONB blob.'},
    {id:'cache',       label:'cache.py',          color:'#58a6ff', desc:'Redis get/set wrappers for world and character objects. Keeps hot data in memory so the tick loop rarely hits Postgres.'},
    {id:'redis_queue', label:'redis_queue.py',    color:'#58a6ff', desc:'Job queue for the async LLM worker process. enqueue() pushes a job dict to Redis list; dequeue_batch() pops up to N jobs for the worker to process concurrently.'},
    {id:'definitions', label:'definitions.py',    color:'#58a6ff', desc:'Loads prop and building template definitions from JSON. Templates define base stats, interactions, and anchor points used at world-load time and by the editor.'},
    {id:'schema_def',  label:'schema_defaults.py',color:'#58a6ff', desc:'Ensures safe zero-values for every world and character field before systems read them. Covers: world["stocks"], world["stock_sector_trends"], world["market"]["catalog"], character["portfolio"], character["watched_stocks"], character["inventory"], character["worn"] (via ensure_worn). Called once on world load and again if new characters are added.'},
    {id:'item_tpl',    label:'data/item_templates.py',color:'#58a6ff', desc:'Master dictionary of 60+ physical item templates. Each entry: {name, category, base_price, stackable, max_stack, dirty, consumable, uses, resource_type, storage_container, quantity}. Clothing entries add: slot, bone (Three.js skeleton bone name), model (.glb path), style, warmth, bilateral. Categories: hygiene, linen, cleaning, dishware, food, groceries, drink, clothing, electronics, assembly_box.'},
  ]
},
{
  id:'brain', label:'Brain / Cognition', color:'#bc8cff',
  pos:[320,80,0],
  desc:'Character AI. Each tick, agent_loop orchestrates: update body → generate intentions → build LLM context → call LLM → route the action → store memory → update emotion. All subjective reasoning, memory, relationships, and emotion live here. context_builder.py is the bridge between the simulation state and the LLM — it now surfaces inventory, worn clothing, investment portfolio, wearable_items, worn_slots, and assembly_boxes as available actions.',
  connects_to:['llm','social','physical'],
  modules:[
    {id:'agent_loop',    label:'agent_loop.py',     color:'#bc8cff', desc:'Per-character update called every tick. Full pipeline: body needs → generate_body_intentions → strategy → schedule → offgrid check → LLM think → action_router → memory store → update_emotion(c, world). Calls put_on_clothing / take_off_clothing / assemble_prop via action_router.'},
    {id:'ctx_builder',   label:'context_builder.py',color:'#bc8cff', desc:'Assembles the JSON context dict fed to the LLM. Pulls memory, relationships, conflicts, grievances, perception, schedule, body state, beliefs, social models, cognitive pressure, inventory summary, worn clothing summary, outfit style score, investment portfolio, and available actions into one object. Available actions include wearable_items (clothing in inventory with a slot), worn_slots (occupied clothing slots), and assembly_boxes (unassembled prop boxes).'},
    {id:'llm_brain',     label:'llm_brain.py',      color:'#bc8cff', desc:'System prompt, build_prompt(), validate_response(), fallback_response(). Defines the strict JSON output schema the model must produce: thought, emotion, intention, goal, action, speech, reflection, confidence.'},
    {id:'memory',        label:'memory.py',         color:'#bc8cff', desc:'Episodic memory: store_memory() adds entries weighted by importance. biased_recall() returns most relevant recent memories using recency + importance scoring. decay_memories() runs at MEDIUM cadence.'},
    {id:'emotion',       label:'emotion.py',        color:'#bc8cff', desc:'Updates character emotion each tick based on recent events, body state, and interaction outcomes. Produces a single emotion label surfaced in context and speech bubbles.'},
    {id:'perception',    label:'perception.py',     color:'#bc8cff', desc:'Builds visible_props and visible_people from the world around the character. Runs every 5 ticks. Output feeds available_actions in context so LLM can reference real prop/character IDs.'},
    {id:'attention',     label:'attention.py',      color:'#bc8cff', desc:'Salience map over perceived objects. Decays each tick. Boosted when something interesting is perceived. Influences what the character notices and prioritises.'},
    {id:'beliefs',       label:'beliefs.py',        color:'#bc8cff', desc:'Political and social beliefs with certainty values. polarization_drift() shifts beliefs based on social circle. compute_alignment() produces a political label included in LLM context.'},
    {id:'relationships_b',label:'relationships.py', color:'#bc8cff', desc:'Per-character relationship schema with 18 fields: trust, friendship, hostility, attraction, resentment, comfort, familiarity, state label. first_impression() and update_relationship_state() run when characters are nearby.'},
    {id:'intentions',    label:'intentions.py',     color:'#bc8cff', desc:'Manages active_intentions list. sort_intentions() by urgency/priority. clean_intentions() removes resolved or expired entries. Body and social systems push intentions here.'},
  ]
},
{
  id:'llm', label:'LLM / Ollama', color:'#ffa657',
  pos:[160,120,277],
  desc:'AI inference layer. All LLM calls go through llm_client.py which caches responses in Redis (5 min TTL, keyed by prompt hash). The worker process dequeues jobs and runs them with a MAX_CONCURRENCY=5 semaphore to prevent thundering-herd Ollama pressure.',
  connects_to:['brain','core'],
  modules:[
    {id:'llm_client',  label:'llm_client.py',       color:'#ffa657', desc:'Raw Ollama HTTP client + Redis response cache. call_llm() is async, hitting /api/chat on the configured OLLAMA_BASE_URL. call_llm_safe() adds a 15s timeout. Cache key is SHA256 of the full message list.'},
    {id:'llm_q',       label:'llm_queue.py',         color:'#ffa657', desc:'In-process asyncio.Queue for serialising LLM calls within a single FastAPI request. Returns a Future so callers can await the result.'},
    {id:'cog_jobs',    label:'cognition_jobs.py',    color:'#ffa657', desc:'Packages cognition tasks as Redis queue jobs for offloading to the worker process. Used when agent ticks are dispatched async rather than inline.'},
    {id:'social_i',    label:'social_interpretation.py',color:'#ffa657',desc:'LLM-powered analysis of conversation outcomes. Generates relationship impact scores and emotion tags from dialogue summaries after a conversation ends.'},
    {id:'worker',      label:'workers/worker.py',    color:'#ffa657', desc:'Separate process consuming Redis job queue. Loads character + world from DB, calls agent_loop, saves updated character. MAX_CONCURRENCY=5 semaphore limits concurrent Ollama calls.'},
  ]
},
{
  id:'social', label:'Social Drama', color:'#f85149',
  pos:[-160,40,260],
  desc:'Interpersonal conflict, negotiation, grudges, and binding agreements. Grievances accumulate per-tick until confrontation threshold is crossed, triggering the three-phase conflict pipeline. Successful negotiation creates a social contract; failed negotiation escalates to a fight which may invoke the law pipeline.',
  connects_to:['brain','economy','core'],
  modules:[
    {id:'grievances',   label:'grievances.py',      color:'#f85149', desc:'Grievance list per character decaying at 0.997/tick. add_grievance() adds weighted events (SEVERITY dict: insulted=8, betrayed=15, contract_violated=10). When total vs someone exceeds 30, emits confrontation_desired.'},
    {id:'conflict',     label:'conflict_pipeline.py',color:'#f85149', desc:'Three-phase state machine: DELIBERATION→NEGOTIATION or FIGHT. Fight has four sub-stages (verbal_dispute→heated_argument→shouting_match→physical_altercation). Outcomes: agreement, cold_shoulder, storm_off, intervention, physical_resolved.'},
    {id:'contracts',    label:'social_contracts.py', color:'#f85149', desc:'Bilateral agreements created by successful negotiation. Terms checked by type: behavior_tag, resource_state, activity, schedule, manual. Violations re-feed grievances at 2.5× weight (betrayal of explicit agreement).'},
    {id:'social_sys',   label:'social.py',           color:'#f85149', desc:'Social context utilities: build_message_context() surfaces recent in-world messages for LLM context. Social group queries and relationship helper functions.'},
    {id:'conv_runtime', label:'conversation_runtime.py',color:'#f85149',desc:'Manages active conversation state: participants, history, topic, tone, turn ownership. update_conversation_activity() advances the turn machine each tick.'},
    {id:'messaging',    label:'messaging.py',        color:'#f85149', desc:'In-world SMS/phone message delivery. Routes messages between characters. deliver_messages() runs every 10 ticks, delivers queued messages to receiver and updates their emotion.'},
    {id:'reactions',    label:'reactions.py',        color:'#f85149', desc:'Queued emotional reactions to world events. process_reaction_queue() applies pending reactions each tick, modifying emotion and stress.'},
    {id:'soc_int',      label:'social_intentions.py',color:'#f85149', desc:'Generates social drive intentions: want to call a friend, resolve a conflict, attend an event. Pushes into agent_loop intention stack to influence LLM decisions.'},
  ]
},
{
  id:'economy', label:'Economy', color:'#3fb950',
  pos:[-320,0,0],
  desc:'Household finances, unified market catalog, stocks, investments, procurement, and expense-driven scheduling. The market is the single price authority for all items and props. Weekly bills are calculated from real home costs (rent, utilities, gasoline, internet) plus food. Minimum work hours = expenses ÷ wage. Social contract recurring blocks are reserved before leisure. All wealth deduction flows through apply_expenses only.',
  connects_to:['physical','core','social'],
  modules:[
    {id:'economy_s',  label:'economy.py',           color:'#3fb950', desc:'apply_expenses() issues weekly bills on Monday 00:00. Splits into fixed_home (rent+utilities) + food (80×members×cost_of_living). Caches household["weekly_expenses"] for schedule generator.'},
    {id:'market',     label:'market.py',            color:'#3fb950', desc:'Unified product catalog. init_market_catalog() seeds world["market"]["catalog"] from ITEM_TEMPLATES + prop_templates. Each entry: {type, name, category, base_price, current_price, requires_assembly, resource_type, storage_container}. update_market() drifts category multipliers (CATEGORY_VOLATILITY dict) and refreshes current_price. get_price(), browse_catalog(category, budget, item_type), apply_news_to_market() for event-driven price spikes.'},
    {id:'stock_mkt',  label:'stock_market.py',      color:'#3fb950', desc:'40-company stock market simulation across 8 sectors. init_stocks() seeds world["stocks"] from data/stocks.py. update_stocks() applies random walk + sector drift + news spikes each MEDIUM tick. Maintains a 60-bar price history per ticker. SECTOR_TAGS maps sectors to news event tags. Helpers: get_stock_price(), top_movers(), sector_performance().'},
    {id:'stocks_d',   label:'data/stocks.py',       color:'#3fb950', desc:'40 fictional company definitions across 8 sectors: tech (NXVT, CYLX, DRVM, QRIX, VLTX, PRXM, MNTH, ELVN), retail (KRTN, VRDX, LMNR, HBTH, GRSL, SPKX), energy (OXFL, SLRV, WNDP, NUCX, GRDX), health (MRVX, BTRX, MDIQ, CLNX, VRTN, HSPX), finance (ARCB, VNTG, FNIX, ISLR, MRKF), consumer (DLVX, BVRG, TRVX, FDBK, ENTX), media (STRM, PBLX, ADVX), industrial (BLDX, MNFX, TRNS, CHMX). Each entry: ticker, name, sector, base_price, volatility, market_cap, news_sensitivity, description.'},
    {id:'invest',     label:'investments.py',       color:'#3fb950', desc:'Sim trading behavior. buy_stock / sell_stock / portfolio_value / position_pnl helpers. update_investment_behavior() runs on SLOW cadence: checks if character has computer/phone, discovers stocks from news, considers sell triggers (take-profit +25%, stop-loss -18%, panic on -5% tick drop) and buy signals (trending up, dip buying). MIN_INVESTABLE_WEALTH=500. Portfolio stored in c["portfolio"] as {ticker: {shares, avg_cost}}.'},
    {id:'procurement',label:'procurement.py',       color:'#3fb950', desc:'Character purchasing system. choose_from_catalog() scores catalog entries by character traits (frugal→price weight, materialistic→quality weight). purchase_from_catalog() dispatches by entry type: resource_type set → add_household_resource; prop + requires_assembly → make_assembly_box() → character inventory; prop no assembly → schedule_delivery_prop(); item online → schedule_delivery_item(); item in-person → make_item() → character inventory.'},
    {id:'deliveries', label:'deliveries.py',        color:'#3fb950', desc:'Delivery queue processing. update_deliveries() polls arrivals each tick. New-format deliveries (catalog_id + type field) call _deliver_item or _deliver_prop from procurement. Legacy product-dict deliveries use _legacy_acquire fallback. Generates a delivery_arrived notification on the household on completion.'},
    {id:'jobs',       label:'jobs.py',              color:'#3fb950', desc:'Job listing generation, hiring, and firing. maybe_fire() emits character_fired → apply_for_job handler. process_interview() emits character_hired on success. generate_job_listings() refreshes market every 60 ticks.'},
    {id:'housing',    label:'housing.py',           color:'#3fb950', desc:'Home assignment and expense defaults. ensure_home_defaults() sets rent/electricity/water/gasoline/internet. weekly_home_expenses() sums them. assign_household_to_home() and vacate_home() manage occupancy.'},
    {id:'scheduling', label:'scheduling.py',        color:'#3fb950', desc:'Expense-driven weekly schedule generator. Priority: sleep → contract blocks → work (hours=expenses/wage) → meals → leisure. adjust_for_household() staggers housemates. Contract recurring_activity terms reserved as fixed slots.'},
    {id:'mail',       label:'mail.py',              color:'#3fb950', desc:'Mailbox, bill payment, and form requests. sort_household_mail() routes items from mailbox["items"]. attempt_pay_bills() deducts from household wealth against bills_due list. respond_to_mail() handles form responses.'},
    {id:'eviction',   label:'eviction.py',          color:'#3fb950', desc:'check_household_for_eviction() emits bills_overdue when overdue bills cross threshold. Event handler calls evict_household() to vacate home and update household status.'},
    {id:'hh_monitor', label:'household_monitoring.py',color:'#3fb950',desc:'Monitors appliance durability and home state each 20 ticks. Importance scales with urgency: 0.6 at ≤25% durability, 0.9 near failure (≤10%). Triggers alerts and repair intentions.'},
  ]
},
{
  id:'physical', label:'Physical World', color:'#d29922',
  pos:[-160,-60,-260],
  desc:'Character embodiment: location, actions, movement, and possessions. Activities are the unit of embodied action with a 6-phase lifecycle (start→walking→arriving→using→finishing→complete). Navigation uses A* between rooms. Characters carry a personal inventory (items, keys, wallet, phone), wear clothing attached to skeleton bones, and can assemble boxed furniture into placed world props. offgrid.py abstracts work/shopping/leisure that happens off-screen.',
  connects_to:['brain','economy','core'],
  modules:[
    {id:'activities',  label:'activities.py',       color:'#d29922', desc:'Authoritative activity executor. execute_activity() advances the current phase. INTERACTION_ANIMATIONS maps interaction→{walking,using,finishing} animations. Manages reservations, IK anchor approach, prop anim states, and completion events.'},
    {id:'act_queue',   label:'activity_queue.py',   color:'#d29922', desc:'Ordered task queue with dependency graph. queue_task() appends with depends_on list. Tasks: pending→active→done. Suspended sessions serialised when higher-priority activity interrupts.'},
    {id:'movement',    label:'movement.py',         color:'#d29922', desc:'Route traversal and interpolation. update_character_movement() advances along route segment-by-segment. Handles arrival detection and _auto_lock_on_exit() — locks home door when a character transitions indoor→outdoor from their home building. Does NOT choose destinations — that is navigation.py and agent_loop.'},
    {id:'navigation',  label:'navigation.py',       color:'#d29922', desc:'A* pathfinding within buildings. Room connectivity graph + NAV_CACHE avoids recomputing identical routes. world_to_local / local_to_world conversions via transforms.py. _auto_unlock_for_prop() is called at route start — if the destination prop is in the character\'s home building, unlock_home() is called automatically.'},
    {id:'outdoor_nav', label:'outdoor_navigation.py',color:'#d29922',desc:'Between-building navigation. Connects building exits to road network. Finds multi-hop paths across the world tile map for characters traveling between locations.'},
    {id:'anchors',     label:'anchors.py',          color:'#d29922', desc:'Prop interaction anchor points. Defined in local-space in templates, projected to world-space at runtime via transforms.py. Characters walk to the anchor position before starting an interaction.'},
    {id:'occupancy',   label:'occupancy.py',        color:'#d29922', desc:'Prop reservation system. Characters reserve anchors before approaching. release_anchor() and release_reservation() called on completion or interruption. Prevents two sims sitting on the same chair.'},
    {id:'props_sys',   label:'props.py',            color:'#d29922', desc:'Prop lookup, get_prop_by_id(), find_nearest_anchor(). Central prop query interface used by activities, navigation, and context builder.'},
    {id:'offgrid',     label:'offgrid.py',          color:'#d29922', desc:'Abstracts off-screen life. send_offgrid() removes character for N ticks. process_return() generates a story arc summary (random events modulated by environment risk) and applies outcomes: money earned, stress changes.'},
    {id:'transforms',  label:'transforms.py',       color:'#d29922', desc:'Authoritative coordinate math: local↔world conversion, rotation, footprint projection, anchor projection. No other system should implement rotation math.'},
    {id:'personal_items',label:'personal_items.py', color:'#d29922', desc:'Personal inventory and essential item system. Factories: make_smartphone(), make_house_key(home_id, building_id), make_wallet(cash), make_id_card(). Inventory CRUD: has_item, get_item, add_item, remove_item. Key/door: has_key_for(c, home_id), can_unlock_door, lock_home, unlock_home. Wallet: wallet_cash, spend_cash, add_cash. make_item(template_id, quantity, **overrides) creates instances from ITEM_TEMPLATES. inventory_summary(c) for LLM context.'},
    {id:'clothing',    label:'clothing.py',         color:'#d29922', desc:'14-slot wearable clothing system. Slots: head/hair/neck/outerwear/torso/undershirt/legs/underwear/socks/feet/hands/wrist_l/wrist_r/accessory — each mapped to a Three.js skeleton bone name. put_on_clothing(c, world, item_id) places item in slot; if slot occupied the displaced item returns to inventory as a stackable item. take_off_clothing(c, world, slot) moves worn item back to inventory. undress_all() strips all slots. tick_clothing_dirty() gives each worn item ~1% chance to become dirty per SLOW tick. outfit_style_score() averages style values, dirty items at 0.4×.'},
    {id:'assembly',    label:'assembly.py',         color:'#d29922', desc:'Prop assembly system. When a prop with requires_assembly=True is purchased, procurement calls make_assembly_box(prop_template_id) to create a box item in the character\'s inventory. The character can then perform the assemble_prop action: the box is removed from inventory and a new prop instance is placed in world["props"] at the character\'s current position. assembly_boxes_in_inventory(c) returns all pending boxes for LLM context.'},
  ]
},
{
  id:'society', label:'Society & Macro', color:'#79c0ff',
  pos:[160,-40,-260],
  desc:'Big-picture systems shaping the world: politics, health, law, emergency services, factions, media, crises, and story arcs. Most are event-driven (fire only when something happens) or very slow cadence (every 300 ticks). Together they create the socioeconomic backdrop characters navigate.',
  connects_to:['core','economy','social'],
  modules:[
    {id:'health',    label:'health.py',         color:'#79c0ff', desc:'Health events triggered by health_threshold_crossed event. process_health() applies treatment/hospitalisation decisions. trigger_health_event() determines severity based on body stats and environment.'},
    {id:'emergency', label:'emergency.py',      color:'#79c0ff', desc:'911 pipeline: trigger_incident() creates incidents, auto_report_incidents() makes calls, dispatch() sends responders. resolve() polls responder arrival ticks. Feeds into law pipeline via incident_resolved event.'},
    {id:'law',       label:'law.py',            color:'#79c0ff', desc:'Arrests, trials, and jail. maybe_arrest_from_incidents() charges characters. process_trials() advances trial_tick. process_jail() releases when jail_until passed. All outcomes emitted as events into event_bus.'},
    {id:'politics',  label:'politics.py',       color:'#79c0ff', desc:'Elections (every 300 ticks) and policy consequences. process_pending_effects() applies economic/social modifiers from enacted policies. check_election() advances election cycle and resolves outcomes.'},
    {id:'faction',   label:'faction_ai.py',     color:'#79c0ff', desc:'Faction behaviour and influence. apply_faction_influence() shifts member beliefs, relationships, and economic outcomes based on faction power and agenda.'},
    {id:'hierarchy', label:'hierarchy.py',      color:'#79c0ff', desc:'Power structure updates. update_hierarchy() recalculates dominance relationships within organisations, workplaces, and households.'},
    {id:'influence', label:'influence.py',      color:'#79c0ff', desc:'Public figure influence on world beliefs. apply_public_figure_influence() shifts character beliefs toward prominent figures. apply_social_influence() propagates attitudes through social networks.'},
    {id:'media',     label:'media.py',          color:'#79c0ff', desc:'News generation with media bias filter. generate_news() creates news_feed entries from world events, framed by outlet bias. News appears in character LLM context.'},
    {id:'crisis',    label:'crisis.py',         color:'#79c0ff', desc:'Economic/social crises. check_crises() detects threshold conditions (unemployment, inequality, unrest). process_crises() applies cascading environment modifiers.'},
    {id:'migration', label:'migration.py',      color:'#79c0ff', desc:'Household migration decisions. check_migration_desires() emits household_wants_to_move when cost-of-living, crime risk, or dissatisfaction exceeds threshold. Handler calls do_migrate().'},
    {id:'story',     label:'story.py',          color:'#79c0ff', desc:'Story arc generation. update_story_arc() creates narrative milestones from significant life events. Used by context_builder to give characters a sense of personal history and trajectory.'},
  ]
},
{
  id:'api', label:'API & Frontend', color:'#e3b341',
  pos:[0,360,0],
  desc:'HTTP and WebSocket surface. main.py runs the FastAPI app, serves the Three.js frontend, and runs the sim tick loop in a background asyncio task. Clients receive a full viewport snapshot on connect, then only dirty (changed) entities each tick. The debug page at /debug provides a stateless dev toolset.',

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020810);
scene.fog = new THREE.FogExp2(0x020810, 0.00045);

const camera = new THREE.PerspectiveCamera(55, W/H, 0.5, 8000);

controls.maxDistance = 2400;

const sun = new THREE.DirectionalLight(0xffffff, 0.4);
sun.position.set(200, 400, 100);
scene.add(sun);

// ── Stars ─────────────────────────────────────────────────────────────────────
(function makeStars(){
  const pos = new Float32Array(3000*3);
  for(let i=0;i<3000;i++){
    pos[i*3]   = (Math.random()-.5)*7000;
    pos[i*3+1] = (Math.random()-.5)*7000;
    pos[i*3+2] = (Math.random()-.5)*7000;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff,size:1.1,transparent:true,opacity:.55})));
})();

// ── Label sprite ──────────────────────────────────────────────────────────────
function makeSprite(text, color, size=14){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `600 ${size}px 'Cascadia Code',monospace`;
  const tw = ctx.measureText(text).width;
  c.width = tw+20; c.height = size+14;
  ctx.font = `600 ${size}px 'Cascadia Code',monospace`;
  ctx.fillStyle = color;
  ctx.globalAlpha = .9;
  ctx.fillText(text, 10, size+1);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false});
  const sp = new THREE.Sprite(mat);
  sp.scale.set((tw+20)/8, (size+14)/8, 1);
  sp.userData.isLabel = true;
  return sp;
}

// ── Fibonacci sphere distribution ─────────────────────────────────────────────
function fibSphere(n, r){
  const pts=[]; const gr=(1+Math.sqrt(5))/2;
  for(let i=0;i<n;i++){
    const th=2*Math.PI*i/gr, ph=Math.acos(1-2*(i+.5)/n);
    pts.push([r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th)]);
  }
  return pts;
}

// ── Build nodes ───────────────────────────────────────────────────────────────
const groupMeshes={}, modMeshes={}, modTargets={}, modLabels={};
const expandedGroups = new Set();
const allInteractive = [];

GROUPS.forEach(g=>{
  // Group icosahedron
  const geo = new THREE.IcosahedronGeometry(24,2);
  const mat = new THREE.MeshPhongMaterial({
    color: new THREE.Color(g.color),
    emissive: new THREE.Color(g.color),
    emissiveIntensity: .28,
    transparent:true, opacity:.82, shininess:120
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...g.pos);
  mesh.userData = {type:'group', group:g};
  scene.add(mesh);
  groupMeshes[g.id] = mesh;
  allInteractive.push(mesh);

  // Inner glow sphere
  const glowGeo = new THREE.SphereGeometry(30,16,16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(g.color), transparent:true, opacity:.06, side:THREE.BackSide
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(...g.pos);
  scene.add(glow);

  // Group label
  const lbl = makeSprite(g.label, g.color, 15);
  lbl.position.set(g.pos[0], g.pos[1]+38, g.pos[2]);
  scene.add(lbl);

  // Module nodes
  const orbitPositions = fibSphere(g.modules.length, 85);
  g.modules.forEach((mod, i)=>{
    const mgeo = new THREE.SphereGeometry(6,14,14);
    const mmat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(g.color),
      emissive: new THREE.Color(g.color),
      emissiveIntensity:.2,
      transparent:true, opacity:0, shininess:80
    });
    const mm = new THREE.Mesh(mgeo, mmat);
    mm.position.set(...g.pos);
    mm.scale.set(0,0,0);
    mm.userData = {type:'module', group:g, module:mod};
    mm.visible = false;
    scene.add(mm);
    modMeshes[mod.id] = mm;
    mod._mesh = mm;
    allInteractive.push(mm);

    modTargets[mod.id] = new THREE.Vector3(
      g.pos[0]+orbitPositions[i][0],
      g.pos[1]+orbitPositions[i][1],
      g.pos[2]+orbitPositions[i][2]
    );

    // Module label
    const ml = makeSprite(mod.label, '#c9d1d9', 10);
    ml.position.set(...g.pos);
    ml.material.opacity = 0;
    scene.add(ml);
    modLabels[mod.id] = ml;
    mod._label = ml;
  });
});
